apiVersion: apps/v1
kind: Deployment
metadata:
  name: kailash-portfolio
  namespace: portfolio
  labels:
    app: kailash-portfolio
spec:
  replicas: 2

  selector:
    matchLabels:
      app: kailash-portfolio

  template:
    metadata:
      labels:
        app: kailash-portfolio
    spec:
      containers:
        - name: kailash-portfolio
          image: kailashbadu/kailash-portfolio-go:v1
          imagePullPolicy: Always

          ports:
            - containerPort: 8080
              protocol: TCP

          env:
            - name: PORT
              value: "8080"

          resources:
            requests:
              cpu: "50m"
              memory: "32Mi" # 32MB RAM guaranteed
            limits:
              cpu: "200m" # 0.2 CPU cores max
              memory: "64Mi" # 64MB RAM max

          # Liveness probe — if this fails, Kubernetes restarts the container
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 15
            failureThreshold: 3

          # Readiness probe — if this fails, pod is removed from the load balancer
          # (no traffic sent until the app is truly ready)
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
            failureThreshold: 3
